[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-api"
version = "0.1.0"
description = "Long audio transcription API with VAD"
readme = "README.md"
requires-python = ">=3.10"
# Deliberately empty. Every dependency belongs to the extra whose modules import
# it, so `stt-api[scicom-livekit-plugin]` in an agent never drags the server
# stack in.
dependencies = []

[project.optional-dependencies]
# Every LiveKit Agents plugin in stt_api/livekit_plugin — whisper_stt, pulse_vad,
# semantic_vad, turn_detector, noise_cancellation, dummy — in one extra:
#     uv pip install "stt-api[scicom-livekit-plugin] @ git+https://github.com/Scicom-AI-Enterprise-Organization/STT-API.git"
# Listed by what the plugin modules actually import. livekit-agents[turn-detector]
# happens to bring aiohttp, numpy, onnxruntime and transformers along today, but a
# module that imports a package names it here rather than relying on that. The
# benchmark and figure tooling inside those packages is NOT covered: it belongs to
# [benchmark], so it never lands in an agent image.
scicom-livekit-plugin = [
    "livekit-agents[turn-detector]~=1.2",
    "numpy",                  # pulse_vad, semantic_vad, whisper_stt, noise_cancellation
    "onnxruntime",            # pulse_vad, semantic_vad, noise_cancellation
    "aiohttp",                # turn_detector and whisper_stt: HTTP to the engines
    "transformers>=4.57.6",   # turn_detector tokenizer, semantic_vad feature extractor
    "huggingface_hub",        # semantic_vad: pulls the SmartTurn weights
    "soundfile",              # dummy: TTS playback file
]
# Pre-rename alias, same contents. Keep both working.
livekit = ["stt-api[scicom-livekit-plugin]"]
server = [
    "fastapi==0.110.2",
    "python-multipart",
    "torch",
    "torchaudio",
    "silero-vad",
    "numpy",
    "uvicorn[standard]",
    "librosa",
    "soundfile",
    "six",
    "uroman",
    "Unidecode",
    "kaldiio==2.18.0",
    "kaldi_native_fbank==1.15",
    "packaging",
    "pyyaml",
    "huggingface_hub",
    "aiohttp",                # main: upstream STT engine calls
    "transformers>=4.57.6",   # force_alignment: MMS-300M
]
# stt_api.evaluation (WER/CER scoring with spelling conventions normalized away) is
# standard-library only — including its LLM pass, which speaks plain urllib. This
# extra is needed ONLY by `load_canonical`, which pulls a dataset's declared
# variant map out of HuggingFace parquet.
evaluation = [
    "huggingface_hub",
    "pyarrow",
]
benchmark = [
    # Noise-cancellation shootout: stt_api.livekit_plugin.noise_cancellation.benchmark.
    # A dev tool, not an agent dependency — none of this ships in the agent image.
    "numpy",
    "onnxruntime",
    "soxr",
    "soundfile",
    "pyarrow",
    "huggingface_hub",
    "librosa",       # DNSMOS P.808 mel features only
    "pesq",          # ITU-T P.862.2 wideband
    "pystoi",        # STOI / ESTOI
    "pyrnnoise",     # Xiph RNNoise via its real C library, not an ONNX re-export
    "livekit-agents~=1.2",  # the GTCRN candidate runs through its production path
    # VAD shootout: stt_api.livekit_plugin.pulse_vad.benchmark. silero is the
    # incumbent being compared against, boto3 only pulls the labelled corpus.
    "livekit-plugins-silero",
    "boto3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: builds a wheel or reaches a package index; skipped when either is unavailable",
]

[tool.setuptools.package-data]
"stt_api.livekit_plugin.dummy" = ["audio/*.mp3", "audio/*.wav"]
# The ONNX weights ship in the wheel; without this the plugin raises at session
# start on an installed copy while working fine from a source checkout.
"stt_api.livekit_plugin.noise_cancellation" = ["resources/*.onnx", "resources/LICENSE.*"]
# The LLM-pass config template, so `cp .../.env.example .../.env` also works for
# someone who pip-installed rather than cloned.
"stt_api.evaluation" = [".env.example"]
# PulseVAD's ONNX weights and its mel filterbank. Without this the plugin raises
# at prewarm on an installed copy while working fine from a source checkout —
# the same trap the noise_cancellation entry above exists to avoid.
"stt_api.livekit_plugin.pulse_vad" = ["resources/*.onnx", "resources/*.npy", "resources/LICENSE.*"]

[tool.setuptools.packages.find]
include = ["stt_api*"]
