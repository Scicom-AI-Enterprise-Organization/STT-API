[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-api"
version = "0.1.0"
description = "Long audio transcription API with VAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "transformers>=4.57.6",
]

[project.optional-dependencies]
livekit = [
    "livekit-agents[turn-detector]~=1.2",
    "soundfile",
    # Self-hosted noise cancellation (livekit_plugin/noise_cancellation). Both
    # already come in with livekit-plugins-silero, so an agent that installs plain
    # `stt-api` alongside the LiveKit plugins still has them.
    "onnxruntime",
    "numpy",
]
server = [
    "fastapi==0.110.2",
    "python-multipart",
    "torch",
    "torchaudio",
    "silero-vad",
    "numpy",
    "uvicorn[standard]",
    "librosa",
    "soundfile",
    "six",
    "uroman",
    "Unidecode",
    "kaldiio==2.18.0",
    "kaldi_native_fbank==1.15",
    "packaging",
    "pyyaml",
    "huggingface_hub",
]
# stt_api.evaluation (WER/CER scoring with spelling conventions normalized away) is
# standard-library only — including its LLM pass, which speaks plain urllib. This
# extra is needed ONLY by `load_canonical`, which pulls a dataset's declared
# variant map out of HuggingFace parquet.
evaluation = [
    "huggingface_hub",
    "pyarrow",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.package-data]
"stt_api.livekit_plugin.dummy" = ["audio/*.mp3", "audio/*.wav"]
# The ONNX weights ship in the wheel; without this the plugin raises at session
# start on an installed copy while working fine from a source checkout.
"stt_api.livekit_plugin.noise_cancellation" = ["resources/*.onnx", "resources/LICENSE.*"]
# The LLM-pass config template, so `cp .../.env.example .../.env` also works for
# someone who pip-installed rather than cloned.
"stt_api.evaluation" = [".env.example"]

[tool.setuptools.packages.find]
include = ["stt_api*"]
