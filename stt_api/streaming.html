<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone WebSocket Stream</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            transition: all 0.2s;
        }
        #startBtn {
            background: #4ade80;
            color: #000;
        }
        #startBtn:hover { background: #22c55e; }
        #stopBtn {
            background: #f87171;
            color: #000;
        }
        #stopBtn:hover { background: #ef4444; }
        #stopBtn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 4px;
            background: #2a2a4a;
        }
        #transcription {
            background: #0a0a1a;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        #log {
            background: #0a0a1a;
            padding: 15px;
            border-radius: 6px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        .log-entry { margin: 4px 0; }
        #visualizer {
            width: 100%;
            height: 100px;
            background: #0a0a1a;
            border-radius: 6px;
            margin: 20px 0;
        }
        .segment {
            margin: 2px 0;
        }
        .timestamp {
            color: #888;
            font-size: 12px;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        label {
            font-size: 14px;
            color: #aaa;
        }
        select {
            padding: 8px 12px;
            font-size: 14px;
            background: #2a2a4a;
            color: #eee;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
        }
        select:focus { outline: none; border-color: #4ade80; }
        .vad-params {
            background: #2a2a4a;
            border-radius: 6px;
            margin: 10px 0;
        }
        .vad-params summary {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            color: #aaa;
            user-select: none;
        }
        .vad-params summary:hover { color: #eee; }
        .vad-params-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px 14px 14px;
        }
        .vad-param {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .vad-param label {
            font-size: 12px;
            color: #888;
        }
        .vad-param input {
            padding: 6px 10px;
            font-size: 14px;
            background: #1a1a2e;
            color: #eee;
            border: 1px solid #444;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .vad-param input:focus { outline: none; border-color: #4ade80; }
        .vad-param input:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Microphone Stream</h1>

    <div class="controls">
        <button id="startBtn">Start Streaming</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="controls">
        <label for="languageSelect">Language:</label>
        <select id="languageSelect">
            <option value="null">Auto-detect</option>
            <option value="ms">Malay (ms)</option>
            <option value="en">English (en)</option>
            <option value="zh">Chinese (zh)</option>
            <option value="ta">Tamil (ta)</option>
        </select>
        <label for="vadSelect">VAD:</label>
        <select id="vadSelect">
            <option value="silero">Silero</option>
            <option value="firered">FireRed</option>
        </select>
    </div>

    <details class="vad-params" id="vadParams">
        <summary>VAD Parameters</summary>
        <div class="vad-params-grid">
            <div class="vad-param">
                <label for="vadThreshold">vad_threshold (0–1)</label>
                <input type="number" id="vadThreshold" min="0" max="1" step="0.05" value="0.5">
            </div>
            <div class="vad-param">
                <label for="minSilentMs">minimum_silent_ms</label>
                <input type="number" id="minSilentMs" min="0" step="50" value="400">
            </div>
            <div class="vad-param">
                <label for="minSpeechMs">minimum_speech_ms</label>
                <input type="number" id="minSpeechMs" min="0" step="50" value="250">
            </div>
            <div class="vad-param">
                <label for="minTriggerVadMs">minimum_trigger_vad_ms</label>
                <input type="number" id="minTriggerVadMs" min="0" step="100" value="1500">
            </div>
            <div class="vad-param">
                <label for="rejectSegmentVadRatio">reject_segment_vad_ratio (0–1)</label>
                <input type="number" id="rejectSegmentVadRatio" min="0" max="1" step="0.05" value="0.7">
            </div>
        </div>
    </details>

    <div id="status">Status: Ready</div>
    <div id="rtfDisplay" style="font-size:13px;color:#aaa;margin:4px 0;min-height:18px;"></div>

    <canvas id="visualizer"></canvas>

    <h3>Transcription</h3>
    <div id="transcription"></div>

    <h3>Log</h3>
    <div id="log"></div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const languageSelect = document.getElementById('languageSelect');
        const vadSelect = document.getElementById('vadSelect');
        const rtfDisplay = document.getElementById('rtfDisplay');
        const vadThresholdInput = document.getElementById('vadThreshold');
        const minSilentMsInput = document.getElementById('minSilentMs');
        const minSpeechMsInput = document.getElementById('minSpeechMs');
        const minTriggerVadMsInput = document.getElementById('minTriggerVadMs');
        const rejectSegmentInput = document.getElementById('rejectSegmentVadRatio');
        const vadParamInputs = [vadThresholdInput, minSilentMsInput, minSpeechMsInput, minTriggerVadMsInput, rejectSegmentInput];
        const status = document.getElementById('status');
        const transcription = document.getElementById('transcription');
        const log = document.getElementById('log');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let analyser = null;
        let animationId = null;
        let lastTranscriptionTime = null;
        let lastSegEnd = null;

        const BUFFER_SIZE = 4096;

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function addTranscription(data) {
            if (data.type === 'transcription') {
                const now = Date.now();
                if (data.segments && data.segments.length > 0) {
                    const segStart = data.segments[0].start;
                    const segEnd = data.segments[data.segments.length - 1].end;
                    const audioDur = segEnd - (lastSegEnd !== null ? lastSegEnd : segStart);
                    if (lastTranscriptionTime !== null && audioDur > 0) {
                        const procTime = (now - lastTranscriptionTime) / 1000;
                        const rtf = (procTime / audioDur).toFixed(3);
                        rtfDisplay.textContent = `RTF: ${rtf}  (proc ${procTime.toFixed(2)}s / audio ${audioDur.toFixed(2)}s)`;
                    }
                    lastSegEnd = segEnd;
                    for (const seg of data.segments) {
                        const div = document.createElement('div');
                        div.className = 'segment';
                        const ts = document.createElement('span');
                        ts.className = 'timestamp';
                        ts.textContent = `[${seg.start.toFixed(1)}s - ${seg.end.toFixed(1)}s] `;
                        div.appendChild(ts);
                        div.appendChild(document.createTextNode(seg.text));
                        transcription.appendChild(div);
                    }
                } else if (data.text) {
                    const div = document.createElement('div');
                    div.className = 'segment';
                    div.textContent = data.text;
                    transcription.appendChild(div);
                }
                lastTranscriptionTime = now;
                transcription.scrollTop = transcription.scrollHeight;
            }
        }

        function drawVisualizer() {
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;
                const hue = (i / bufferLength) * 120 + 120;
                ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }

            animationId = requestAnimationFrame(drawVisualizer);
        }

        async function startStreaming() {
            try {
                const selectedVad = vadSelect.value;
                const wsProto = window.location.protocol === 'https:' ? 'wss' : 'ws';
                const params = new URLSearchParams({
                    language: languageSelect.value,
                    vad: selectedVad,
                    vad_threshold: vadThresholdInput.value,
                    minimum_silent_ms: minSilentMsInput.value,
                    minimum_speech_ms: minSpeechMsInput.value,
                    minimum_trigger_vad_ms: minTriggerVadMsInput.value,
                    reject_segment_vad_ratio: rejectSegmentInput.value,
                });
                const wsUrl = `${wsProto}://${window.location.host}/ws?${params}`;
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';

                ws.onopen = () => {
                    status.textContent = 'Status: Connected to server';
                    addLog('WebSocket connected');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.error) {
                            addLog(`Error: ${data.error}`);
                        } else if (data.type === 'silent') {
                            addLog('Silent segment skipped');
                        } else if (data.type === 'transcription') {
                            addTranscription(data);
                            if (data.language) {
                                addLog(`Transcription received (lang: ${data.language})`);
                            } else {
                                addLog('Transcription received');
                            }
                        }
                    } catch (e) {
                        addLog(`Raw: ${event.data}`);
                    }
                };

                ws.onerror = (error) => {
                    addLog('WebSocket error');
                    console.error(error);
                };

                ws.onclose = () => {
                    status.textContent = 'Status: Disconnected';
                    addLog('WebSocket closed');
                };

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                processor = audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const buffer = new Float32Array(inputData);
                        ws.send(buffer.buffer);
                    }
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                status.textContent = 'Status: Streaming...';
                addLog('Microphone streaming started');

                lastTranscriptionTime = null;
                lastSegEnd = null;
                rtfDisplay.textContent = '';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                languageSelect.disabled = true;
                vadSelect.disabled = true;
                vadParamInputs.forEach(i => i.disabled = true);

                drawVisualizer();

            } catch (error) {
                status.textContent = `Status: Error - ${error.message}`;
                addLog(`Error: ${error.message}`);
                console.error(error);
            }
        }

        function stopStreaming() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            if (processor) {
                processor.disconnect();
                processor = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (ws) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({type: 'end'}));
                }
                ws.close();
                ws = null;
            }

            analyser = null;

            status.textContent = 'Status: Stopped';
            addLog('Streaming stopped');

            startBtn.disabled = false;
            stopBtn.disabled = true;
            languageSelect.disabled = false;
            vadSelect.disabled = false;
            vadParamInputs.forEach(i => i.disabled = false);
        }

        startBtn.addEventListener('click', startStreaming);
        stopBtn.addEventListener('click', stopStreaming);
    </script>
</body>
</html>
